[package]
name = "kimi-lite"
version = "0.1.6"
edition = "2021"
description = "Lightweight native desktop app for Kimi Code's web UI, local or over SSH"
license = "MIT"
repository = "https://github.com/BugenZhao/kimi-lite"

[lib]
name = "kimi_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "net", "time", "io-util", "sync", "macros", "rt-multi-thread"] }

[profile.release]
# The system `strip` on macOS 27 produces dylibs dyld refuses to load
# ("mis-aligned LINKEDIT string pool"), which breaks proc macros. Rust's
# default `strip = "debuginfo"` for release would hit it.
strip = false
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"

[profile.release.build-override]
strip = false

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSControl", "NSButton", "NSAlert", "NSApplication", "NSRunningApplication", "NSPasteboard", "NSGraphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString"] }
