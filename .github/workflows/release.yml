name: Release

# Pushing a `v*` tag builds the app and publishes a GitHub release with it,
# including the signed update archive and `latest.json` that installed copies
# check for updates. Running the workflow by hand builds the same files as a
# workflow artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    runs-on: macos-15
    env:
      # With the Developer ID secrets the app is signed, notarized and
      # stapled. Without them (forks) it gets an ad-hoc signature, which
      # Apple Silicon needs to run it at all; Gatekeeper then asks on first
      # open.
      SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
      # Signs the update archive; the app only installs updates signed by it.
      UPDATER: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, for the release notes since the previous one.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} in tauri.conf.json"
            exit 1
          fi

      - name: Version
        id: version
        run: |
          echo "app=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Import the signing certificate
        if: env.SIGNED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

      # The commit goes into CFBundleVersion: About shows "0.1.0 (abc1234)".
      # With APPLE_API_KEY(_PATH) and APPLE_API_ISSUER set, Tauri notarizes
      # the app and staples the ticket, then packs the update archive.
      - name: Build
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          config="{\"bundle\":{\"createUpdaterArtifacts\":${UPDATER},\"macOS\":{\"bundleVersion\":\"${COMMIT}\"}}}"
          pnpm tauri build --bundles app,dmg --config "$config"

      - name: Notarize the disk image
        if: env.SIGNED == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          bundle=src-tauri/target/release/bundle
          dmg="$(ls "$bundle"/dmg/*.dmg)"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
          # Notarization can be accepted while fetching the ticket from
          # Apple's CDN still fails now and then: retry the staple.
          for attempt in 1 2 3 4 5; do
            xcrun stapler staple "$dmg" && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 15))
          done
          spctl --assess --type execute --verbose=2 "$bundle/macos/Kimi Lite.app"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

      - name: Collect files
        env:
          APP_VERSION: ${{ steps.version.outputs.app }}
          VERSION: ${{ steps.version.outputs.app }}-${{ steps.version.outputs.commit }}
        run: |
          bundle=src-tauri/target/release/bundle
          mkdir dist
          cp "$bundle"/dmg/*.dmg "dist/Kimi-Lite_${VERSION}_aarch64.dmg"
          ditto -c -k --keepParent "$bundle/macos/Kimi Lite.app" "dist/Kimi-Lite_${VERSION}_aarch64.app.zip"

          # Release notes: the commits since the previous tag.
          previous="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            git log --no-merges --format='- %s' "$previous..HEAD" | grep -v '^- Release ' > notes.md || true
          fi
          [ -s notes.md ] || echo "- First release." > notes.md

          if [ "$UPDATER" = true ]; then
            archive="Kimi-Lite_${VERSION}_aarch64.app.tar.gz"
            cp "$bundle/macos/Kimi Lite.app.tar.gz" "dist/$archive"
            cp "$bundle/macos/Kimi Lite.app.tar.gz.sig" "dist/$archive.sig"
            # The archive must hold the notarized, stapled app.
            if [ "$SIGNED" = true ]; then
              mkdir -p "$RUNNER_TEMP/check" && tar -xzf "dist/$archive" -C "$RUNNER_TEMP/check"
              xcrun stapler validate "$RUNNER_TEMP/check/Kimi Lite.app"
              spctl --assess --type execute --verbose=2 "$RUNNER_TEMP/check/Kimi Lite.app"
            fi
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${archive}"
            node -e '
              const fs = require("fs");
              const [version, url, sig] = process.argv.slice(1);
              fs.writeFileSync("dist/latest.json", JSON.stringify({
                version,
                notes: fs.readFileSync("notes.md", "utf8").trim(),
                pub_date: new Date().toISOString(),
                platforms: { "darwin-aarch64": { signature: fs.readFileSync(sig, "utf8").trim(), url } },
              }, null, 2) + "\n");
            ' "$APP_VERSION" "$url" "dist/$archive.sig"
          fi
          (cd dist && shasum -a 256 -- * > SHA256SUMS)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: kimi-lite-macos-arm64
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Kimi Lite ${{ steps.version.outputs.app }} (${{ steps.version.outputs.commit }})
        run: gh release create "$GITHUB_REF_NAME" dist/* --notes-file notes.md --title "$TITLE"

      - name: Remove the signing keychain
        if: always() && env.SIGNED == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
